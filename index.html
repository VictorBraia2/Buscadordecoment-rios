<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Buscador de Comentários & Vídeos — Dashboard</title>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/pptxgenjs@3.12.0/dist/pptxgen.bundle.js"></script>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script>
  tailwind.config = {
    theme: {
      extend: {
        fontFamily: { sans: ['Inter', 'sans-serif'] },
        colors: { brand: { 50: '#fef2f2', 100: '#fee2e2', 500: '#ef4444', 600: '#dc2626', 700: '#b91c1c' } }
      }
    }
  }
</script>
<style>
  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
  ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
</style>
</head>
<body class="bg-slate-50 text-slate-900 h-screen flex flex-col md:flex-row overflow-hidden antialiased">

<aside class="w-full md:w-80 bg-white border-r border-slate-200 flex flex-col h-1/2 md:h-full z-20 shadow-sm flex-shrink-0">
  <div class="h-16 flex items-center px-6 border-b border-slate-200 bg-white">
    <div class="w-8 h-8 bg-brand-600 rounded-lg flex items-center justify-center mr-3 shadow-sm">
      <svg class="w-4 h-4 text-white" fill="currentColor" viewBox="0 0 24 24"><path d="M23 7s-.3-2-1.2-2.8C20.7 3 19.4 3 18.8 2.9 16.2 2.8 12 2.8 12 2.8s-4.2 0-6.8.1C4.6 3 3.3 3 2.2 4.2 1.3 5 1 7 1 7S.7 9.3.7 11.5v2.1c0 2.2.3 4.4.3 4.4s.3 2 1.2 2.8c1.1 1.2 2.6 1.1 3.3 1.2C7.3 22.2 12 22.2 12 22.2s4.2 0 6.8-.3c.6-.1 1.9-.1 3-1.3.9-.8 1.2-2.8 1.2-2.8s.3-2.2.3-4.4v-2.1C23.3 9.3 23 7 23 7zm-13.8 8.9V8.1l8.1 3.9-8.1 3.9z"/></svg>
    </div>
    <h1 class="font-semibold text-[15px] tracking-tight">Análise YouTube</h1>
  </div>

  <div class="flex-1 overflow-y-auto p-5 space-y-6">
    <div id="cardVideosInput" class="space-y-2">
      <label class="block text-xs font-bold text-slate-500 uppercase tracking-wider">Fontes de Dados</label>
      <textarea id="videoInput" placeholder="https://youtube.com/watch?v=...&#10;Cole links ou IDs (um por linha)" class="w-full h-28 rounded-lg border border-slate-300 px-3 py-2 text-sm focus:ring-2 focus:ring-brand-500 focus:border-brand-500 outline-none resize-none transition-all shadow-sm" oninput="onVideoInput()"></textarea>
      <div id="videoBadge" class="empty:hidden"></div>
    </div>

    <div id="cardKeywords" class="space-y-2">
      <label class="block text-xs font-bold text-slate-500 uppercase tracking-wider">Filtro de Palavras</label>
      <div class="flex gap-2">
        <input type="text" id="kwInput" placeholder="Ex: inteligência..." class="flex-1 rounded-lg border border-slate-300 px-3 py-2 text-sm focus:ring-2 focus:ring-brand-500 focus:border-brand-500 outline-none shadow-sm" />
        <button onclick="addKw()" class="bg-slate-100 hover:bg-slate-200 text-slate-700 px-3 rounded-lg text-sm font-medium transition-colors border border-slate-200">Add</button>
      </div>
      <div id="tagArea" class="flex flex-wrap gap-1.5 mt-2 min-h-[24px]">
        <span class="text-xs text-slate-400">Sem filtros (exibe todos)</span>
      </div>
    </div>

    <div id="cardDisplayCols" class="space-y-2">
      <label class="block text-xs font-bold text-slate-500 uppercase tracking-wider">Colunas Visíveis</label>
      <div class="grid grid-cols-2 gap-2 text-sm">
        <label class="flex items-center gap-2 text-slate-400 cursor-not-allowed"><input type="checkbox" checked disabled class="accent-brand-500 w-4 h-4"> Texto</label>
        <label class="flex items-center gap-2 cursor-pointer hover:text-brand-600"><input type="checkbox" id="chk_video" checked class="accent-brand-500 w-4 h-4 cursor-pointer"> Vídeo</label>
        <label class="flex items-center gap-2 cursor-pointer hover:text-brand-600"><input type="checkbox" id="chk_author" checked class="accent-brand-500 w-4 h-4 cursor-pointer"> Autor</label>
        <label class="flex items-center gap-2 cursor-pointer hover:text-brand-600"><input type="checkbox" id="chk_date" checked class="accent-brand-500 w-4 h-4 cursor-pointer"> Data</label>
        <label class="flex items-center gap-2 cursor-pointer hover:text-brand-600"><input type="checkbox" id="chk_likes" checked class="accent-brand-500 w-4 h-4 cursor-pointer"> Curtidas</label>
        <label class="flex items-center gap-2 cursor-pointer hover:text-brand-600"><input type="checkbox" id="chk_link" checked class="accent-brand-500 w-4 h-4 cursor-pointer"> Link</label>
      </div>
    </div>

    <div id="cardVideoSearch" class="space-y-4 hidden">
      <div>
        <label class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-2">Termo de Busca</label>
        <input type="text" id="videoQuery" placeholder="Ex: geopolítica..." class="w-full rounded-lg border border-slate-300 px-3 py-2 text-sm focus:ring-2 focus:ring-brand-500 outline-none shadow-sm" />
      </div>
      <div>
        <label class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-2">Ordenar por</label>
        <div class="flex bg-slate-100 p-1 rounded-lg border border-slate-200">
          <button id="orderRel" class="flex-1 py-1.5 text-xs font-medium rounded-md bg-white shadow-sm text-brand-600 border border-slate-200" onclick="setOrder('relevance')">Visualizações</button>
          <button id="orderDate" class="flex-1 py-1.5 text-xs font-medium rounded-md text-slate-500 hover:text-slate-700" onclick="setOrder('date')">Recentes</button>
        </div>
      </div>
      <div>
        <label class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-2">Resultados</label>
        <div class="flex gap-2">
          <button id="cnt10" class="flex-1 py-1.5 text-xs font-medium rounded-lg border border-slate-200 text-slate-600 hover:bg-slate-100" onclick="setCount(10)">10</button>
          <button id="cnt20" class="flex-1 py-1.5 text-xs font-medium rounded-lg border border-brand-500 bg-brand-50 text-brand-700" onclick="setCount(20)">20</button>
          <button id="cnt50" class="flex-1 py-1.5 text-xs font-medium rounded-lg border border-slate-200 text-slate-600 hover:bg-slate-100" onclick="setCount(50)">50</button>
        </div>
      </div>
    </div>

    <div id="cardVideoFilters" class="space-y-4 hidden">
      <div>
        <label class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-2">País</label>
        <select id="regionSelect" class="w-full rounded-lg border border-slate-300 px-3 py-2 text-sm focus:ring-2 focus:ring-brand-500 outline-none shadow-sm bg-white">
          <option value="BR" selected>Brasil (BR)</option>
          <option value="US">Estados Unidos (US)</option>
          <option value="PT">Portugal (PT)</option>
          <option value="ALL">Global / Todas</option>
        </select>
      </div>
      <div>
        <label class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-2">Ano Específico</label>
        <select id="dateSelect" class="w-full rounded-lg border border-slate-300 px-3 py-2 text-sm focus:ring-2 focus:ring-brand-500 outline-none shadow-sm bg-white">
          <option value="ALL" selected>Qualquer ano</option>
          <option value="2026">2026</option>
          <option value="2025">2025</option>
          <option value="2024">2024</option>
          <option value="2023">2023</option>
          <option value="2022">2022</option>
          <option value="2021">2021</option>
          <option value="2020">2020</option>
        </select>
      </div>
    </div>

    <div id="cardHistory" class="space-y-2 border-t border-slate-200 pt-4 hidden">
      <div class="flex items-center justify-between">
        <label class="block text-xs font-bold text-slate-500 uppercase tracking-wider">Histórico de Pesquisas</label>
        <button onclick="clearSearchHistory()" class="text-[11px] text-red-500 hover:underline">Limpar</button>
      </div>
      <div id="historyListContainer" class="space-y-1.5 max-h-48 overflow-y-auto text-xs"></div>
    </div>

    <div class="pt-4 border-t border-slate-200 space-y-2 mt-auto">
      <div id="errorBox" class="hidden items-start gap-2 bg-red-50 text-red-700 text-xs p-3 rounded-lg border border-red-200 mb-4">
        <span class="font-bold">⚠</span><span id="errorMsg"></span>
      </div>

      <button id="btnSearch" onclick="doSearch()" class="w-full bg-brand-600 hover:bg-brand-700 text-white font-semibold py-3 px-4 rounded-xl flex items-center justify-center gap-2 transition-all shadow-sm">
        <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
        Extrair Comentários
      </button>

      <button id="btnVideoSearch" onclick="doVideoSearch()" class="hidden w-full bg-brand-600 hover:bg-brand-700 text-white font-semibold py-3 px-4 rounded-xl items-center justify-center gap-2 transition-all shadow-sm">
        <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
        Buscar Vídeos
      </button>
      
      <div id="cardExportOpts" class="pt-2">
        <div class="flex gap-2 mb-2 justify-center text-sm">
          <label class="flex items-center gap-1.5"><input type="checkbox" id="exp_xlsx" checked class="accent-brand-500 w-4 h-4"> Excel</label>
          <label class="flex items-center gap-1.5"><input type="checkbox" id="exp_csv" class="accent-brand-500 w-4 h-4"> CSV</label>
        </div>
        <button id="btnExport" onclick="doExport()" class="hidden w-full bg-white hover:bg-slate-50 text-slate-700 border border-slate-300 font-medium py-2.5 px-4 rounded-lg flex items-center justify-center gap-2 transition-all shadow-sm text-sm">
          <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"/></svg> Exportar Comentários
        </button>
      </div>

      <button id="btnClear" onclick="clearAll()" class="hidden w-full text-slate-400 hover:text-red-500 font-medium py-2 text-sm transition-colors">Limpar Sessão</button>
    </div>
  </div>
</aside>

<main class="flex-1 flex flex-col h-1/2 md:h-full relative overflow-hidden bg-slate-50">
  
  <header class="bg-white border-b border-slate-200 px-6 pt-4 flex gap-6">
    <button id="tabComments" onclick="switchTab('comments')" class="pb-3 text-sm font-medium border-b-2 border-brand-500 text-brand-600 transition-colors">Comentários (Alvos)</button>
    <button id="tabVideos" onclick="switchTab('videos')" class="pb-3 text-sm font-medium border-b-2 border-transparent text-slate-500 hover:text-slate-700 hover:border-slate-300 transition-colors">Pesquisa de Vídeos</button>
  </header>

  <div id="panelComments" class="flex-1 overflow-y-auto p-6 md:p-8">
    <div id="progCard" class="hidden bg-white p-4 rounded-xl border border-slate-200 shadow-sm mb-6">
      <h3 class="text-xs font-bold text-slate-500 uppercase mb-3">Progresso da Extração</h3>
      <div id="progList" class="space-y-2"></div>
    </div>

    <div id="resHeader" class="hidden flex flex-col md:flex-row md:items-center justify-between gap-4 mb-6">
      <div>
        <h2 class="text-lg font-bold text-slate-800">Resultados Encontrados</h2>
        <span id="badgeCount" class="inline-block mt-1 bg-brand-100 text-brand-700 px-2 py-0.5 rounded-full text-xs font-semibold"></span>
      </div>
      <input type="text" id="searchInline" placeholder="Buscar no texto do comentário..." class="w-full md:w-64 rounded-lg border border-slate-300 px-3 py-2 text-sm focus:ring-2 focus:ring-brand-500 outline-none shadow-sm bg-white" oninput="applyInline()" />
    </div>

    <div id="resArea" class="space-y-3">
      <div class="h-64 flex flex-col items-center justify-center text-slate-400 text-center">
        <svg class="w-12 h-12 mb-3 opacity-20" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5"><path stroke-linecap="round" stroke-linejoin="round" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z"/></svg>
        <p class="text-sm">Preencha as URLs na barra lateral e clique em <strong class="text-slate-600">Extrair</strong></p>
      </div>
    </div>
    
    <div id="pagArea" class="flex justify-center items-center gap-1 mt-8 pb-8 flex-wrap"></div>
  </div>

  <div id="panelVideos" class="hidden flex-1 overflow-y-auto p-6 md:p-8">
    <div id="videoResArea">
      <div class="h-64 flex flex-col items-center justify-center text-slate-400 text-center">
        <svg class="w-12 h-12 mb-3 opacity-20" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5"><path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
        <p class="text-sm">Utilize os filtros laterais para mapear novos vídeos sobre um assunto.</p>
      </div>
    </div>
  </div>

  <div id="toast" class="fixed bottom-6 left-1/2 -translate-x-1/2 translate-y-24 bg-slate-900 text-white px-5 py-3 rounded-full text-sm font-medium shadow-xl opacity-0 transition-all duration-300 pointer-events-none z-50 flex items-center gap-2"></div>

</main>

<script>
let videoOrder = 'relevance';
let videoCount = 20;
let currentVideos = [];
let currentQuery = '';

const HISTORY_KEY = 'yt_analyzer_search_history';

function switchTab(tab) {
  const isC = (tab === 'comments');
  
  document.getElementById('tabComments').className = `pb-3 text-sm font-medium border-b-2 transition-colors ${isC ? 'border-brand-500 text-brand-600' : 'border-transparent text-slate-500 hover:text-slate-700 hover:border-slate-300'}`;
  document.getElementById('tabVideos').className = `pb-3 text-sm font-medium border-b-2 transition-colors ${!isC ? 'border-brand-500 text-brand-600' : 'border-transparent text-slate-500 hover:text-slate-700 hover:border-slate-300'}`;
  
  document.getElementById('panelComments').style.display = isC ? 'block' : 'none';
  document.getElementById('panelVideos').style.display = !isC ? 'block' : 'none';
  
  document.getElementById('cardVideosInput').style.display = isC ? 'block' : 'none';
  document.getElementById('cardKeywords').style.display = isC ? 'block' : 'none';
  document.getElementById('cardDisplayCols').style.display = isC ? 'block' : 'none';
  document.getElementById('cardExportOpts').style.display = isC ? 'block' : 'none';
  
  document.getElementById('cardVideoSearch').style.display = isC ? 'none' : 'block';
  document.getElementById('cardVideoFilters').style.display = isC ? 'none' : 'block';
  document.getElementById('cardHistory').style.display = isC ? 'none' : 'block';
  
  document.getElementById('btnSearch').style.display = isC ? 'flex' : 'none';
  document.getElementById('btnVideoSearch').style.display = isC ? 'none' : 'flex';
  
  if (!isC) {
    document.getElementById('btnExport').classList.add('hidden');
    document.getElementById('btnClear').classList.add('hidden');
  } else if (allResults && allResults.length > 0) {
    document.getElementById('btnExport').classList.remove('hidden');
    document.getElementById('btnClear').classList.remove('hidden');
  }
}

function setOrder(order) {
  videoOrder = order;
  const rel = document.getElementById('orderRel');
  const dat = document.getElementById('orderDate');
  
  rel.className = order === 'relevance' 
    ? 'flex-1 py-1.5 text-xs font-medium rounded-md bg-white shadow-sm text-brand-600 border border-slate-200' 
    : 'flex-1 py-1.5 text-xs font-medium rounded-md text-slate-500 hover:text-slate-700';
    
  dat.className = order === 'date' 
    ? 'flex-1 py-1.5 text-xs font-medium rounded-md bg-white shadow-sm text-brand-600 border border-slate-200' 
    : 'flex-1 py-1.5 text-xs font-medium rounded-md text-slate-500 hover:text-slate-700';
}

function setCount(n) {
  videoCount = n;
  ['cnt10','cnt20','cnt50'].forEach(id => {
    const el = document.getElementById(id);
    const num = parseInt(el.textContent);
    el.className = (num === n) 
      ? 'flex-1 py-1.5 text-xs font-medium rounded-lg border border-brand-500 bg-brand-50 text-brand-700 transition-colors' 
      : 'flex-1 py-1.5 text-xs font-medium rounded-lg border border-slate-200 text-slate-600 hover:bg-slate-100 transition-colors';
  });
}

const esc = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
function fmtNum(n) {
  if (n >= 1e9) return (n/1e9).toFixed(1).replace('.0','') + 'bi';
  if (n >= 1e6) return (n/1e6).toFixed(1).replace('.0','') + 'M';
  if (n >= 1e3) return (n/1e3).toFixed(1).replace('.0','') + 'K';
  return String(n);
}
function initials(n) { return (n||'?').split(' ').slice(0,2).map(w=>w[0]||'').join('').toUpperCase()||'?'; }
function fmtDate(iso) { try { return new Date(iso).toLocaleDateString('pt-BR'); } catch { return iso; } }

function toast(msg) {
  const t = document.getElementById('toast');
  t.innerHTML = `<svg class="w-5 h-5 text-green-400" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"/></svg> ${msg}`;
  t.classList.remove('translate-y-24', 'opacity-0');
  clearTimeout(t._t); 
  t._t = setTimeout(() => t.classList.add('translate-y-24', 'opacity-0'), 3000);
}
function showErr(msg) { document.getElementById('errorMsg').textContent=msg; document.getElementById('errorBox').classList.remove('hidden'); document.getElementById('errorBox').classList.add('flex'); }
function hideErr() { document.getElementById('errorBox').classList.add('hidden'); document.getElementById('errorBox').classList.remove('flex'); }

function sendToComments(url) {
  const ta = document.getElementById('videoInput');
  ta.value = ta.value.trim() ? ta.value.trim() + '\n' + url : url;
  onVideoInput();
  switchTab('comments');
  toast('Adicionado à fila de extração!');
}

function saveSearchToHistory(params, totalResults) {
  const history = getSearchHistory();
  const newEntry = {
    id: Date.now(),
    timestamp: new Date().toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' }),
    query: params.q,
    region: params.regionCode || 'BR',
    year: params.dateFilter || 'ALL',
    totalResults: totalResults,
    params: params
  };

  const filtered = history.filter(item => 
    !(item.query.toLowerCase() === params.q.toLowerCase() && item.region === params.regionCode && item.year === params.dateFilter)
  );

  const updatedHistory = [newEntry, ...filtered].slice(0, 20);
  localStorage.setItem(HISTORY_KEY, JSON.stringify(updatedHistory));
  renderHistoryUI();
}

function getSearchHistory() {
  try {
    return JSON.parse(localStorage.getItem(HISTORY_KEY)) || [];
  } catch (e) {
    return [];
  }
}

function clearSearchHistory() {
  localStorage.removeItem(HISTORY_KEY);
  renderHistoryUI();
}

function renderHistoryUI() {
  const container = document.getElementById('historyListContainer');
  if (!container) return;

  const history = getSearchHistory();
  if (!history.length) {
    container.innerHTML = '<p class="text-slate-400 p-1">Nenhum histórico registrado.</p>';
    return;
  }

  container.innerHTML = history.map(item => `
    <div class="p-2 hover:bg-slate-100 rounded-lg border border-slate-100 transition-colors cursor-pointer flex justify-between items-center group" onclick='loadSearchFromHistory(${JSON.stringify(item.params)})'>
      <div class="truncate pr-2">
        <div class="font-semibold text-slate-800 truncate">${esc(item.query)}</div>
        <div class="text-[10px] text-slate-400">${item.region} • ${item.year} • ${item.totalResults} vids</div>
      </div>
      <span class="text-[10px] text-slate-400 flex-shrink-0">${item.timestamp}</span>
    </div>
  `).join('');
}

function loadSearchFromHistory(params) {
  if (!params) return;
  if (params.q) document.getElementById('videoQuery').value = params.q;
  if (params.regionCode) document.getElementById('regionSelect').value = params.regionCode;
  if (params.dateFilter) document.getElementById('dateSelect').value = params.dateFilter;
  if (params.order) setOrder(params.order);
  if (params.maxResults) setCount(params.maxResults);
  doVideoSearch();
}

function exportToExcel(videos, queryTerm) {
  if (!videos || !videos.length) {
    showErr('Nenhum vídeo disponível para exportar.');
    return;
  }

  const formattedData = videos.map((v, index) => {
    const engRate = v.views > 0 ? (((v.likes + v.comments) / v.views) * 100).toFixed(2) : '0.00';
    return {
      "Posição": `#${index + 1}`,
      "Título do Vídeo": v.title,
      "Canal": v.channel,
      "Visualizações": v.views,
      "Curtidas": v.likes,
      "Comentários": v.comments,
      "Taxa Engajamento (%)": `${engRate}%`,
      "Duração (s)": v.duration,
      "Data Publicação": fmtDate(v.publishedAt),
      "Link": v.url
    };
  });

  const worksheet = XLSX.utils.json_to_sheet(formattedData);
  worksheet['!cols'] = [
    { wch: 8 }, { wch: 45 }, { wch: 25 }, { wch: 15 },
    { wch: 12 }, { wch: 14 }, { wch: 18 }, { wch: 12 }, { wch: 16 }, { wch: 35 }
  ];

  const workbook = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(workbook, worksheet, "Resultados Mapeados");
  XLSX.writeFile(workbook, `Relatorio_YouTube_${queryTerm.replace(/[^a-zA-Z0-9]/g, '_')}_${Date.now()}.xlsx`);
  toast('Relatório Excel exportado!');
}

function exportToPowerPoint(videos, queryTerm) {
  if (!videos || !videos.length) {
    showErr('Nenhum vídeo disponível para exportar.');
    return;
  }

  const pptx = new PptxGenJS();
  pptx.layout = 'LAYOUT_16x9';

  const slideCover = pptx.addSlide();
  slideCover.background = { color: '0F172A' };

  slideCover.addText("RELATÓRIO DE ANALÍTICA E CONTEÚDO", {
    x: 0.8, y: 1.5, w: '85%', fontSize: 14, color: '38BDF8', bold: true
  });

async function doVideoSearch() {
  const q = (document.getElementById('videoQuery').value || '').trim();
  if (!q) { showErr('Informe um termo para buscar vídeos.'); return; }
  hideErr();

  const region = document.getElementById('regionSelect').value;
  const year = document.getElementById('dateSelect').value;
  const area = document.getElementById('videoResArea');
  const btn = document.getElementById('btnVideoSearch');
  
  btn.disabled = true;
  area.innerHTML = '<div class="h-64 flex flex-col items-center justify-center text-slate-500"><svg class="w-8 h-8 animate-spin text-brand-500 mb-3" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg>Buscando na API...</div>';

  try {
    let fetchLimit = videoCount * 3;
    let url = `/api/search?q=${encodeURIComponent(q)}&order=${videoOrder}&maxResults=${fetchLimit}`;
    if (region && region !== 'ALL') url += '&regionCode=' + encodeURIComponent(region);
    if (year && year !== 'ALL') {
      const publishedAfter = `${year}-01-01T00:00:00Z`;
      const publishedBefore = `${parseInt(year) + 1}-01-01T00:00:00Z`;
      url += `&publishedAfter=${encodeURIComponent(publishedAfter)}&publishedBefore=${encodeURIComponent(publishedBefore)}`;
    }

    const res = await fetch(url);
    const data = await res.json();
    if (data.error) throw new Error(data.error);

    let raw = data.videos || [];
    let filtered = raw.filter(v => {
      const urlLower = (v.url || '').toLowerCase();
      const titleLower = (v.title || '').toLowerCase();
      if (urlLower.includes('/shorts/')) return false;
      if (titleLower.includes('#shorts') || titleLower.includes('#short')) return false;
      if (v.duration && v.duration <= 60) return false;
      return true;
    }).slice(0, videoCount);

    currentVideos = filtered;
    currentQuery = q;

    saveSearchToHistory({ q, regionCode: region, dateFilter: year, order: videoOrder, maxResults: videoCount }, filtered.length);
    renderVideos(filtered, q, year);
    toast(`${filtered.length} resultados mapeados.`);
  } catch(e) {
    showErr(e.message);
    area.innerHTML = '<div class="h-64 flex items-center justify-center text-red-500 font-medium">Erro na busca. Verifique a API.</div>';
  } finally {
    btn.disabled = false;
  }
}

  document.getElementById('kwInput').addEventListener('keydown', e => { if(e.key==='Enter') { e.preventDefault(); addKw(); }});
  document.getElementById('videoQuery').addEventListener('keydown', e => { if(e.key==='Enter') doVideoSearch(); });

function extractId(raw) {
  raw = (raw||'').trim();
  const ps = [/[?&]v=([\w-]{11})/,/youtu\.be\/([\w-]{11})/,/\/shorts\/([\w-]{11})/,/\/embed\/([\w-]{11})/,/^([\w-]{11})$/];
  for (const p of ps) { const m = raw.match(p); if (m) return m[1]; }
  return null;
}
function parseVideos(txt) {
  const seen = new Set(); const out = [];
  for (const line of txt.split(/[\n,]+/).map(s=>s.trim()).filter(Boolean)) {
    const id = extractId(line);
    if (id && !seen.has(id)) { seen.add(id); out.push({raw:line,id}); }
    else if (!id) out.push({raw:line,id:null});
  }
  return out;
}
function onVideoInput() {
  const v = document.getElementById('videoInput').value;
  const bd = document.getElementById('videoBadge');
  if (!v.trim()) { bd.innerHTML=''; return; }
  const p = parseVideos(v);
  const ok = p.filter(x=>x.id).length;
  bd.innerHTML = `<span class="inline-block mt-1 bg-brand-50 text-brand-700 border border-brand-200 px-2 py-0.5 rounded text-[10px] font-bold uppercase tracking-wider">${ok} válidos detectados</span>`;
}

function addKw() {
  const inp = document.getElementById('kwInput');
  const val = inp.value.trim().toLowerCase();
  if (!val || keywords.includes(val)) { inp.value=''; return; }
  keywords.push(val); inp.value=''; renderTags(); applyInline();
}
function removeKw(i) { keywords.splice(i,1); renderTags(); applyInline(); }
function renderTags() {
  const area = document.getElementById('tagArea');
  if (!keywords.length) { area.innerHTML='<span class="text-xs text-slate-400">Sem filtros (exibe todos)</span>'; return; }
  area.innerHTML = keywords.map((k,i)=>`<div class="inline-flex items-center gap-1.5 bg-brand-50 text-brand-700 border border-brand-200 rounded-md px-2 py-1 text-xs font-semibold">${esc(k)}<button onclick="removeKw(${i})" class="text-brand-400 hover:text-brand-700 leading-none">×</button></div>`).join('');
}

function highlight(text, kws) {
  if (!kws.length) return esc(text);
  const safe = esc(text);
  const re = new RegExp(`(${kws.map(k=>k.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')).join('|')})`, 'gi');
  return safe.replace(re,'<mark class="bg-yellow-200 text-yellow-900 px-1 rounded-sm">$1</mark>');
}

async function fetchTitle(id) {
  try { const res = await fetch(`/api/title?videoId=${encodeURIComponent(id)}`); const d = await res.json(); return d.error ? id : d.title || id; } 
  catch { return id; }
}
async function fetchComments(videoId, onProg) {
  const list = []; let token = ''; let page = 0;
  do {
    let url = `/api/comments?videoId=${encodeURIComponent(videoId)}`;
    if (token) url += `&pageToken=${encodeURIComponent(token)}`;
    const res = await fetch(url); const data = await res.json();
    if (data.error) throw new Error(data.error);
    if (data.comments) list.push(...data.comments);
    token = data.nextPageToken || ''; page++;
    if (onProg) onProg(page, list.length);
    if (page >= 10) break;
  } while (token);
  return list;
}

async function doSearch() {
  const txt = document.getElementById('videoInput').value;
  const parsed = parseVideos(txt).filter(x => x.id);
  if (!parsed.length) { showErr('Insira ao menos um link válido.'); return; }
  hideErr();

  document.getElementById('btnSearch').disabled = true;
  const pCard = document.getElementById('progCard');
  const pList = document.getElementById('progList');
  pCard.classList.remove('hidden'); pList.innerHTML = '';
  allResults = []; videoTitles = {};

  for (let i = 0; i < parsed.length; i++) {
    const item = parsed[i]; const divId = 'prog_' + i;
    pList.insertAdjacentHTML('beforeend', `<div id="${divId}" class="flex items-center gap-3 text-sm p-2 rounded-lg bg-slate-50 border border-slate-100"><svg class="w-4 h-4 animate-spin text-brand-500 flex-shrink-0" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg><span class="text-slate-600 truncate">Processando alvo: ${item.id}</span></div>`);
    
    try {
      const title = await fetchTitle(item.id); videoTitles[item.id] = title;
      const comments = await fetchComments(item.id, (pg, count) => {
        const el = document.getElementById(divId); if(el) el.querySelector('span').textContent = `[${count} extraídos] ${title}`;
      });
      comments.forEach(c => { c.videoId = item.id; c.videoTitle = title; });
      allResults.push(...comments);
      
      const el = document.getElementById(divId);
      el.className = 'flex items-center gap-3 text-sm p-2 rounded-lg bg-emerald-50 border border-emerald-100 text-emerald-800 font-medium';
      el.innerHTML = `<svg class="w-5 h-5 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"/></svg><span class="truncate">${comments.length} encontrados em: ${title}</span>`;
    } catch (e) {
      const el = document.getElementById(divId);
      el.className = 'flex items-center gap-3 text-sm p-2 rounded-lg bg-red-50 border border-red-100 text-red-800 font-medium';
      el.innerHTML = `<svg class="w-5 h-5 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/></svg><span class="truncate">Erro: ${e.message}</span>`;
    }
  }

  document.getElementById('btnSearch').disabled = false;
  applyInline();
  if (allResults.length > 0) {
    document.getElementById('btnExport').classList.remove('hidden');
    document.getElementById('btnClear').classList.remove('hidden');
    toast(`Extração concluída: ${allResults.length} comentários na base.`);
  }
}

function applyInline() {
  const query = (document.getElementById('searchInline').value || '').toLowerCase().trim();
  displayed = allResults.filter(c => {
    if (keywords.length > 0) {
      if (!keywords.some(k => c.text.toLowerCase().includes(k))) return false;
    }
    if (query) {
      if (!(c.text.toLowerCase().includes(query) || c.author.toLowerCase().includes(query) || c.videoTitle.toLowerCase().includes(query))) return false;
    }
    return true;
  });
  currentPage = 1; renderResults();
}

function renderResults() {

  if (allResults.length === 0) {
    document.getElementById('resHeader').classList.add('hidden');
    area.innerHTML = '<div class="h-64 flex flex-col items-center justify-center text-slate-400 text-center"><svg class="w-12 h-12 mb-3 opacity-20" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5"><path stroke-linecap="round" stroke-linejoin="round" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z"/></svg><p class="text-sm">Preencha as URLs na barra lateral e clique em <strong class="text-slate-600">Extrair</strong></p></div>';

  }
  
  document.getElementById('resHeader').classList.remove('hidden');
  document.getElementById('resHeader').classList.add('flex');

  const totalPages = Math.ceil(displayed.length / PAGE_SIZE);
  if (currentPage > totalPages) currentPage = totalPages;

  const start = (currentPage - 1) * PAGE_SIZE;
  const end = start + PAGE_SIZE;
  const pageItems = displayed.slice(start, end);

  const chkVideo = document.getElementById('chk_video').checked;
  const chkAuthor = document.getElementById('chk_author').checked;
  const chkDate = document.getElementById('chk_date').checked;
  const chkLikes = document.getElementById('chk_likes').checked;
  const chkLink = document.getElementById('chk_link').checked;

  let html = pageItems.map(c => {
    const textHl = highlight(c.text, keywords);
    return `
      <div class="bg-white p-4 rounded-xl border border-slate-200 shadow-sm hover:shadow-md transition-all space-y-3">
        <div class="flex items-start justify-between gap-4">
          <div class="flex items-center gap-2.5">
            ${chkAuthor ? `<div class="w-8 h-8 rounded-full bg-slate-100 border border-slate-200 flex items-center justify-center font-bold text-xs text-slate-600 uppercase">${initials(c.author)}</div><div><div class="font-semibold text-sm text-slate-800">${esc(c.author)}</div></div>` : ''}
          </div>
          <div class="flex items-center gap-3 text-xs text-slate-400">
            ${chkDate ? `<span>${fmtDate(c.publishedAt)}</span>` : ''}
            ${chkLikes ? `<span class="flex items-center gap-1 font-medium text-slate-600 bg-slate-100 px-2 py-0.5 rounded-full"><svg class="w-3.5 h-3.5 text-slate-400" viewBox="0 0 24 24" fill="currentColor"><path d="M14 9V5a3 3 0 0 0-3-3l-4 9v11h11.28a2 2 0 0 0 2-1.7l1.38-9a2 2 0 0 0-2-2.3H14z"/></svg>${c.likes}</span>` : ''}
          </div>
        </div>
        <p class="text-sm text-slate-700 leading-relaxed break-words whitespace-pre-wrap">${textHl}</p>
        ${chkVideo || chkLink ? `
          <div class="pt-2 border-t border-slate-100 flex items-center justify-between text-xs text-slate-500">
            ${chkVideo ? `<span class="truncate font-medium text-slate-600" title="${esc(c.videoTitle)}">Vídeo: ${esc(c.videoTitle)}</span>` : '<span></span>'}
            ${chkLink ? `<a href="https://www.youtube.com/watch?v=${c.videoId}&lc=${c.id}" target="_blank" class="text-brand-600 hover:text-brand-700 font-semibold flex items-center gap-1 flex-shrink-0">Ver no YouTube <svg class="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"/></svg></a>` : ''}
          </div>
        ` : ''}
      </div>
    `;
  }).join('');

  area.innerHTML = html;
  renderPagination(totalPages);
}

function renderPagination(totalPages) {
  const pag = document.getElementById('pagArea');
  if (totalPages <= 1) { pag.innerHTML = ''; return; }

  let html = '';
  for (let i = 1; i <= totalPages; i++) {
    const active = (i === currentPage);
    html += `<button onclick="goToPage(${i})" class="px-3 py-1.5 rounded-lg text-xs font-semibold transition-colors ${active ? 'bg-brand-600 text-white' : 'bg-white text-slate-600 border border-slate-200 hover:bg-slate-50'}">${i}</button>`;
  }
  pag.innerHTML = html;
}

function goToPage(p) {
  currentPage = p;
  renderResults();
  document.getElementById('panelComments').scrollTop = 0;
}

function doExport() {
  if (!displayed.length) { showErr('Não há dados para exportar.'); return; }
  const isXlsx = document.getElementById('exp_xlsx').checked;
  const isCsv = document.getElementById('exp_csv').checked;

  if (!isXlsx && !isCsv) { showErr('Selecione ao menos um formato para exportação.'); return; }

  const rows = displayed.map(c => ({
    "Vídeo ID": c.videoId,
    "Título do Vídeo": c.videoTitle,
    "Autor": c.author,
    "Comentário": c.text,
    "Curtidas": c.likes,
    "Data": fmtDate(c.publishedAt),
    "Link": `https://www.youtube.com/watch?v=${c.videoId}&lc=${c.id}`
  }));

  if (isXlsx) {
    const ws = XLSX.utils.json_to_sheet(rows);
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, "Comentários");
    XLSX.writeFile(wb, `comentarios_youtube_${Date.now()}.xlsx`);
  }

  if (isCsv) {
    const ws = XLSX.utils.json_to_sheet(rows);
    const csv = XLSX.utils.sheet_to_csv(ws);
    const blob = new Blob(["\ufeff" + csv], { type: 'text/csv;charset=utf-8;' });
    const link = document.createElement("a");
    link.href = URL.createObjectURL(blob);
    link.download = `comentarios_youtube_${Date.now()}.csv`;
    link.click();
  }
}

function clearAll() {
  allResults = [];
  displayed = [];
  videoTitles = {};
  document.getElementById('videoInput').value = '';
  document.getElementById('videoBadge').innerHTML = '';
  document.getElementById('kwInput').value = '';
  keywords = [];
  renderTags();
  document.getElementById('searchInline').value = '';
  document.getElementById('progCard').classList.add('hidden');
  document.getElementById('progList').innerHTML = '';
  document.getElementById('btnExport').classList.add('hidden');
  document.getElementById('btnClear').classList.add('hidden');
  renderResults();
  hideErr();
}
</script>
</body>
</html>
